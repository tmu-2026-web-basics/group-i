    <link rel="stylesheet" href="../streetlight.css" />

  </head>
  <body id="detail-top" class="detail-is-loading" data-streetlight="1" aria-busy="true">
    <section class="dot-field">
      <canvas class="halftone" aria-hidden="true"></canvas>
      <main class="detail-card">
        <header class="detail-header">
          <a class="detail-header__home" href="../../index.html" aria-label="トップページへ戻る"><img src="../../images/logo/icon-yoko.webp" alt="上を向いて歩こう" /></a>
        </header>
        <section class="detail-hero" aria-labelledby="streetlight-name">
          <h1 class="detail-hero__title--contained" id="streetlight-name">
            <img src="../../images/logo/logo_01.webp" alt="街灯01" />
          </h1>
          <div class="detail-hero__lamp">
            <img src="../../images/streetlight/streetlight_01/detail-top_01.webp" alt="街灯01のイラスト" />
          </div>
        </section>
        <div class="detail-content">
          <div class="story-sticky">
            <figure class="street-photo">
              <img src="../../images/photo/photo_01.webp" alt="街灯01を見上げた写真" />
            </figure>
            <div class="story-sticky__copy">
              <section class="story story--where" aria-labelledby="where-title">
                <div class="story__text">
                  <h2 id="where-title">どこの街灯か</h2>
                  <p>
                    阿佐ヶ谷駅の周りには17個もの商店街があり、そのうちの1つ、スターロード商店街の街灯。<br />
                    道幅は狭いが、人通りは多い。
                  </p>
                </div>
              </section>
              <section class="story story--comment" aria-labelledby="comment-title">
                <div class="story__text">
                  <h2 id="comment-title">街灯に一言</h2>
                  <p>
                    星の模様が描かれた看板、<br />
                    ステンドグラスで囲われた照明、<br />
                    四角い照明はどこか灯篭のようで、<br />
                    昔ながらの温かみを感じる。
                  </p>
                </div>
              </section>
            </div>
          </div>
          <section class="location" aria-labelledby="location-title">
            <div class="map-frame" id="map01">
              <iframe
                title="東京都杉並区阿佐谷北2丁目のGoogleマップ"
                src="https://www.google.com/maps?q=%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%9D%89%E4%B8%A6%E5%8C%BA%E9%98%BF%E4%BD%90%E8%B0%B7%E5%8C%972%E4%B8%81%E7%9B%AE&amp;output=embed"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen
              ></iframe>
            </div>
            <div class="location__text">
              <h2 id="location-title">場所のご案内</h2>
              <address>東京都杉並区阿佐谷北2丁目</address>
            </div>
          </section>
          <nav class="other-lights" aria-label="ほかの街灯を見る"><p>other lights...</p><div class="other-lights__viewport"><div class="other-lights__track"></div></div></nav>
        </div>
