                    ここは神奈川県元住吉駅の商店街。実はこの商店街には「ブレーメン通り」という名前がある。大きいデパートこそないが、さまざまなお店が集まっていて、いつも地域の人々で賑わっている。鶏、ロバ、イヌの街灯もある。（<a href="https://bremen-st.com/environmental/" target="_blank" rel="noopener noreferrer">モトスミ・ブレーメン通り商店街HP</a>）
                  </p>

                  </p>
