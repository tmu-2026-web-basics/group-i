<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="街灯03の詳細ページです。" />
    <title>街灯03 | 上を向いて歩こう</title>
    <link rel="icon" href="../../images/logo/icon-top.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../streetlight.css" />
    <script src="../streetlight.js" defer></script>
  </head>
  <body id="detail-top" data-streetlight="3">
    <section class="dot-field">
      <canvas class="halftone" aria-hidden="true"></canvas>
      <main class="detail-card">
        <header class="detail-header"><a class="detail-header__home" href="../../index.html" aria-label="トップページへ戻る"><img src="../../images/logo/icon-yoko.webp" alt="上を向いて歩こう" /></a></header>
        <section class="detail-hero" aria-labelledby="streetlight-name">
          <h1 class="detail-hero__title--contained" id="streetlight-name"><img src="../../images/logo/logo_03.webp" alt="街灯03" /></h1>
          <div class="detail-hero__lamp"><img src="../../images/streetlight/streetlight_03/detail-top_03.webp" alt="街灯03のイラスト" /></div>
        </section>
        <div class="detail-content">
          <div class="story-sticky">
            <figure class="street-photo"><img src="../../images/photo/photo_03.webp" alt="街灯03を見上げた写真" /></figure>
            <div class="story-sticky__copy">
              <section class="story story--where" aria-labelledby="where-title">
                <div class="story__text">
                  <h2 id="where-title">どこの街灯か</h2>
                  <p>白金高輪駅付近　ナチュラルローソンの前の歩道橋。人通りこそ多くはないが、横断歩道が少ないため道を渡る際はよく使われる。</p>
                </div>
              </section>
              <section class="story story--comment" aria-labelledby="comment-title">
                <div class="story__text">
                  <h2 id="comment-title">街灯に一言</h2>
                  <p>
                    普段この歩道橋の横を通っていても<br />
                    気が付かなかったけれど<br />
                    実は歩道橋の側面についていて、床から浮いている。<br />
                    歩道橋の下に公衆電話があるから<br />
                    邪魔しないために浮いてるのかな？
                  </p>
                </div>
              </section>
            </div>
          </div>
          <section class="location" aria-labelledby="location-title">
            <div class="map-frame" id="map03">
              <iframe
                title="東京都港区白金1丁目12のGoogleマップ"
                src="https://www.google.com/maps?q=%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%B8%AF%E5%8C%BA%E7%99%BD%E9%87%911%E4%B8%81%E7%9B%AE12&amp;output=embed"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen
              ></iframe>
            </div>
            <div class="location__text">
              <h2 id="location-title">場所のご案内</h2>
              <address>東京都港区白金１丁目１２</address>
            </div>
          </section>
          <nav class="other-lights" aria-label="ほかの街灯を見る"><p>other lights...</p><div class="other-lights__viewport"><div class="other-lights__track"></div></div></nav>
        </div>
      </main>
    </section>
    <footer class="detail-bottom"><img src="../../images/logo/icon-white.webp" alt="上を向いて歩こう" /><small>© group-i</small></footer>
    <a class="street-return" href="../../index.html?streetlight=3" aria-label="トップページの街灯3の場所へ戻る"><span aria-hidden="true">←</span><span>戻る</span></a>
  </body>
</html>
