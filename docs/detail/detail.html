<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="街灯の詳細ページです。" />
    <title>街灯 | 上を向いて歩こう</title>
    <link rel="icon" href="../images/logo/icon-top.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./streetlight.css" />
    <script src="./streetlight-data.js" defer></script>
    <script src="./streetlight.js" defer></script>
  </head>
  <body id="detail-top" class="detail-is-loading" aria-busy="true">
    <section class="dot-field">
      <canvas class="halftone" aria-hidden="true"></canvas>
      <main class="detail-card">
        <header class="detail-header">
          <a class="detail-header__home" href="../index.html" aria-label="トップページへ戻る">
            <img src="../images/logo/icon-yoko.webp" alt="上を向いて歩こう" />
          </a>
        </header>

        <section class="detail-hero" aria-labelledby="streetlight-name">
          <h1 id="streetlight-name"><img id="detail-logo" alt="" /></h1>
          <div class="detail-hero__lamp"><img id="detail-lamp" alt="" /></div>
        </section>

        <div class="detail-content">
          <div class="story-sticky">
            <figure class="street-photo"><img id="detail-photo" alt="" /></figure>
            <div class="story-sticky__copy">
              <section class="story story--where" aria-labelledby="where-title">
                <div class="story__text">
                  <h2 id="where-title">どこの街灯か</h2>
                  <p id="detail-where"></p>
                </div>
              </section>
              <section class="story story--comment" aria-labelledby="comment-title">
                <div class="story__text">
                  <h2 id="comment-title">街灯に一言</h2>
                  <p id="detail-comment"></p>
                </div>
              </section>
            </div>
          </div>

          <section class="location" aria-labelledby="location-title">
            <div class="map-frame" id="detail-map">
              <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
            </div>
            <div class="location__text">
              <h2 id="location-title">場所のご案内</h2>
              <address id="detail-address"></address>
            </div>
          </section>

          <nav class="other-lights" aria-label="ほかの街灯を見る">
            <p>other lights...</p>
            <div class="other-lights__viewport"><div class="other-lights__track"></div></div>
          </nav>
        </div>
      </main>
    </section>

    <footer class="detail-bottom">
      <div class="detail-bottom__credit">
        <a class="detail-bottom__home" href="../index.html" aria-label="トップページへ戻る">
          <img src="../images/logo/icon-white.webp" alt="上を向いて歩こう" />
        </a>
        <small>©︎2026 group-i</small>
      </div>
    </footer>

    <a class="street-return" href="../index.html" aria-label="トップページの街灯の場所へ戻る">
      <span aria-hidden="true">←</span><span>戻る</span>
    </a>
  </body>
</html>
