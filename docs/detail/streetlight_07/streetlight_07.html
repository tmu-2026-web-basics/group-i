  <body id="detail-top" data-streetlight="7">
    <section class="dot-field">
      <canvas class="halftone" aria-hidden="true"></canvas>
      <main class="detail-card">
        <header class="detail-header"><a class="detail-header__home" href="../../index.html" aria-label="トップページへ戻る"><img src="../../images/logo/icon-yoko.webp" alt="上を向いて歩こう" /></a></header>
        <section class="detail-hero" aria-labelledby="streetlight-name">
          <h1 class="detail-hero__title--contained" id="streetlight-name">
            <img src="../../images/logo/logo_07.webp" alt="街灯07" />
          </h1>
          <div class="detail-hero__lamp"><img src="../../images/streetlight/streetlight_07/detail-top_07.webp" alt="街灯07のイラスト" /></div>
        </section>
        <div class="detail-content">
          <div class="story-sticky">
            <figure class="street-photo"><img src="../../images/photo/photo_07.webp" alt="街灯07を見上げた写真" /></figure>
            <div class="story-sticky__copy">
              <section class="story story--where" aria-labelledby="where-title">
                <div class="story__text">
                  <h2 id="where-title">どこの街灯か</h2>
                  <p>
                    ここは東京都大田区の「多摩川園前商栄会」の通り。多摩川の自然と、そこで暮らす人々と、おしゃれなお店たちに囲まれている。実はここ、多摩川園という遊園地が昔あったらしい。
                  </p>
                </div>
              </section>
              <section class="story story--comment" aria-labelledby="comment-title">
                <div class="story__text">
                  <h2 id="comment-title">街灯に一言</h2>
                  <p>
                    あの頃の遊園地を照らしたレトロなガス灯式デザイン。もう閉園しちゃったけれど、今でもこの多摩川の街と住む人々を、歴史ある光で照らしてくれている…！
                  </p>
                </div>
              </section>
            </div>
          </div>
          <section class="location" aria-labelledby="location-title">
            <div class="map-frame" id="map07">
              <iframe
                title="東京都大田区田園調布1-60-4のGoogleマップ"
                src="https://www.google.com/maps?q=%E6%9D%B1%E4%BA%AC%E9%83%BD%E5%A4%A7%E7%94%B0%E5%8C%BA%E7%94%B0%E5%9C%92%E8%AA%BF%E5%B8%831-60-4&amp;output=embed"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen
              ></iframe>
            </div>
            <div class="location__text">
              <h2 id="location-title">場所のご案内</h2>
              <address>東京都大田区田園調布1-60-4</address>
            </div>
          </section>
          <nav class="other-lights" aria-label="ほかの街灯を見る"><p>other lights...</p><div class="other-lights__viewport"><div class="other-lights__track"></div></div></nav>
