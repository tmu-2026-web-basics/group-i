<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="早稲田大学の近くにある街灯04を、写真と文章で紹介する詳細ページです。"
    />
    <title>街灯04 | 上を向いて歩こう</title>
    <link rel="icon" href="../../images/logo/icon-top.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../streetlight.css" />
    <script src="../streetlight.js" defer></script>
  </head>

  <body id="detail-top" data-streetlight="4">
    <section class="dot-field">
      <canvas class="halftone" aria-hidden="true"></canvas>

      <main class="detail-card">
        <header class="detail-header">
          <a class="detail-header__home" href="../../index.html" aria-label="トップページへ戻る">
            <img src="../../images/logo/icon-yoko.webp" alt="上を向いて歩こう" />
          </a>
        </header>

        <section class="detail-hero" aria-labelledby="streetlight-name">
          <h1 id="streetlight-name">
            <img src="../../images/logo/logo_04.webp" alt="めがねくん" />
          </h1>
          <div class="detail-hero__lamp">
            <img
              src="../../images/streetlight/streetlight_04/detail-top_04.webp"
              alt="めがねのように見える街灯04のイラスト"
            />
          </div>
        </section>

        <div class="detail-content">
          <div class="story-sticky">
            <figure class="street-photo">
              <img
                src="../../images/photo/photo_04.webp"
                alt="早稲田町にある街灯04を見上げた写真"
              />
            </figure>

            <div class="story-sticky__copy">
              <section class="story story--where" aria-labelledby="where-title">
                <div class="story__text">
                  <h2 id="where-title">どこの街灯か</h2>
                  <p>
                    ここは早稲田大学のすぐそば。学生たちが足早に行き交い、観光客も交じるこの道は、一日中人の流れが絶えない。
                  </p>
                </div>
              </section>

              <section class="story story--comment" aria-labelledby="comment-title">
                <div class="story__text">
                  <h2 id="comment-title">街灯に一言</h2>
                  <p>
                    真下から2歩ほど離れて見上げると、<br />
                    街灯の縁と支柱の曲線が重なり、<br />
                    メガネをかけているように見える。<br />
                    早稲田大学の近くだから、<br />
                    なんとなく知的なデザインにしたのかな。
                  </p>
                </div>
              </section>
            </div>
          </div>

          <section class="location" aria-labelledby="location-title">
            <div class="map-frame" id="map04">
              <iframe
                title="東京都新宿区早稲田町のGoogleマップ"
                src="https://www.google.com/maps?q=%E3%80%92162-0042%20%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%96%B0%E5%AE%BF%E5%8C%BA%E6%97%A9%E7%A8%B2%E7%94%B0%E7%94%BA&amp;output=embed"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen
              ></iframe>
            </div>

            <div class="location__text">
              <h2 id="location-title">場所のご案内</h2>
              <address>
                東京都新宿区早稲田町
              </address>
            </div>
          </section>

          <nav class="other-lights" aria-label="ほかの街灯を見る">
            <p>other lights...</p>
            <div class="other-lights__viewport">
              <div class="other-lights__track"></div>
            </div>
          </nav>
        </div>
      </main>
    </section>

    <footer class="detail-bottom">
      <img src="../../images/logo/icon-white.webp" alt="上を向いて歩こう" />
      <small>© group-i</small>
    </footer>

    <a
      class="street-return"
      href="../../index.html?streetlight=4"
      aria-label="トップページの街灯4の場所へ戻る"
    >
      <span aria-hidden="true">←</span>
      <span>戻る</span>
    </a>
  </body>
</html>
